name: Build APK (Flutter 3.35.1)

on:
  push:
    branches: [ flet, feature/MFS ]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # FLUTTER_VERSION: 3.35.1
  PYTHON_VERSION: 3.12.1
  PYTHONIOENCODING: utf-8 

jobs:
  build_APK:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. Fetch code
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. Install Python
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    # 3. Install Flet-CLI
    - name: Install Flet
      run: python -m pip install flet
    # 4. Build APK
    - name: Build APK
      run: yes | flet build apk    
    #4.5 upload to artifact   
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build results
        path: build/apk/
        retention-days: 1
        overwrite: true    

  build_win:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # 1. Fetch code
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. Install Flet-CLI
    - name: Install Flet
      run: python -m pip install flet
    # 3. Build Win
    - name: Build Win
      run: flet build windows  --yes    
    #4 upload to artifact   
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build results
        path: build/windows/
        retention-days: 1
        overwrite: true

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [build_APK, build_win]
    steps:
    # 5.  Release
    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        files: build/apk/app-release.apk,build/windows/*.exe        
        generate_release_notes: true
        tag_name: ${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    


    