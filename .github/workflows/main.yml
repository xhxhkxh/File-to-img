name: Build APK (Flutter 3.35.1)

on:
  push:
    branches: [ flet ]
    paths-ignore:
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

env:
  # FLUTTER_VERSION: 3.35.1
  PYTHON_VERSION: 3.12.1
  PYTHONIOENCODING: utf-8 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    # 1. Fetch code
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 2. Install Python
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    # 3. Install Flutter（Version 3.24.5）
    #- name: Install Flutter
      #uses: subosito/flutter-action@v2
      #with:
        #flutter-version: ${{ env.FLUTTER_VERSION }}
        #cache: true          

    #3.5 JPEG lib 
    #- name: Install JPEG libs 
    #  run: sudo apt update && sudo apt install libjpeg-dev zlib1g-dev libpng-dev libfreetype6-dev liblcms2-dev libopenjp2-7-dev libtiff5-dev libwebp-dev

    # chcp for rich lib
    - name: change page 
      run: chcp 65001
    
    # 4. Install Flet-CLI
    - name: Install Flet
      run: python -m pip install flet

    #- name: update flutter 
      #run: flutter upgrade

    # 5. Build APK
    - name: Build APK
      run: flet build apk

    # 6. Generate tag
    - name: Generate tag
      id: version
      run: echo "tag=v$(date +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

    - name: Create and push tag
      run: |
       git config user.name "github-actions"
       git config user.email "github-actions@github.com"
       git tag ${{ steps.version.outputs.tag }}
       git push origin ${{ steps.version.outputs.tag }}

    # 7.  Release
    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        files: build/app/outputs/flutter-apk/app-release.apk        
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
