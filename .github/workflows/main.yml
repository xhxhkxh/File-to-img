name: Build APK (Flutter 3.24.5)

on:
  push:
    branches: [ flet ]
    paths-ignore:
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.24.5
  PYTHON_VERSION: 3.12.1

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    # 1. Fetch code
    - uses: actions/checkout@v4

    # 2. Install Python
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    # 3. Install Flutter（Version 3.24.5）
    - name: Install Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true          

    #3.5 JPEG lib 
    #- name: Install JPEG libs 
    #  run: sudo apt update && sudo apt install libjpeg-dev zlib1g-dev libpng-dev libfreetype6-dev liblcms2-dev libopenjp2-7-dev libtiff5-dev libwebp-dev

    
    # 4. Install Flet-CLI
    - name: Install Flet
      run: python -m pip install flet

    # 5. Build APK
    - name: Build APK
      run: flet build apk

    # 6. Generate tag
    - name: Generate tag
      id: version
      run: echo "tag=v$(date +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

    # 7.  Release
    - name: Create release
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ steps.version.outputs.tag }}
        name: Android APK Release ${{ steps.version.outputs.tag }}
        body: |
          Auto-generated from commit ${{ github.sha }}.
          Flutter ${{ env.FLUTTER_VERSION }} / Dart 3.9
        artifacts: build/app/outputs/flutter-apk/app-release.apk
        artifactContentType: application/vnd.android.package-archive
        makeLatest: true
        token: ${{ secrets.GITHUB_TOKEN }}
